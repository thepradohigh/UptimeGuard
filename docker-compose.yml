version: "3.8"

services:
  uptimeguard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uptimeguard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "file:/app/prisma/dev.db"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID}"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASS: "${SMTP_PASS}"
      SMTP_FROM: "${SMTP_FROM}"
      NOTIFICATION_EMAIL: "${NOTIFICATION_EMAIL}"
    volumes:
      - uptimeguard_data:/app/prisma

volumes:
  uptimeguard_data:
